name: Build Frida 17.16.4 Universal iOS DEB v4

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: Frida tag/version to build
        required: true
        default: '17.16.4'

permissions:
  contents: read

concurrency:
  group: frida-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  FRIDA_VERSION: ${{ inputs.frida_version || '17.16.4' }}

jobs:
  build:
    name: iPhone 13 / iOS 16.6 universal Frida
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Show macOS and Xcode environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          node --version
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make dpkg
          gmake --version
          dpkg-deb --version

      - name: Create temporary Frida code-signing identity
        timeout-minutes: 3
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/create-frida-cert.sh
          .github/scripts/create-frida-cert.sh

      - name: Verify signing identity before the long build
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${IOS_CERTID:-}"
          test -n "${FRIDA_KEYCHAIN_PATH:-}"
          test -f "${FRIDA_KEYCHAIN_PATH}"
          echo "Using IOS_CERTID=${IOS_CERTID}"
          security find-certificate -Z -c frida-cert "${FRIDA_KEYCHAIN_PATH}"

      - name: Build universal iOS packages
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_frida_universal_ios.sh
          FRIDA_TAG="${FRIDA_VERSION}" ./build_frida_universal_ios.sh \
            --output "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}"

      - name: Verify rootless package and Mach-O slices
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x verify_frida_package_macos.sh
          ./verify_frida_package_macos.sh \
            "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/frida_${FRIDA_VERSION}_iphoneos-arm64_universal.deb"
          cat "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/BUILD-INFO.txt"
          cat "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/SHA256SUMS"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-${{ env.FRIDA_VERSION }}-iphone13-ios16.6-universal-debs
          path: release-frida-${{ env.FRIDA_VERSION }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${FRIDA_KEYCHAIN_PATH:-}" && -f "$FRIDA_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$FRIDA_KEYCHAIN_PATH" || true
          fi
