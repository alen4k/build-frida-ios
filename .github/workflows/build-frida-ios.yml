name: Build Frida 17.5.0 Universal iOS DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iPhone 13 / iOS 16.6 universal Frida
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Show macOS and Xcode environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          node --version
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install make dpkg
          gmake --version
          dpkg-deb --version

      - name: Create temporary Frida code-signing identity
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/create-frida-cert.sh
          .github/scripts/create-frida-cert.sh

      - name: Verify signing identity before the long build
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${IOS_CERTID:-}"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -F "$IOS_CERTID"

      - name: Build Frida 17.5.0 universal iOS packages
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_frida_17.5.0_universal_ios.sh
          ./build_frida_17.5.0_universal_ios.sh \
            --output "${GITHUB_WORKSPACE}/release-frida-17.5.0"

      - name: Verify rootless package and Mach-O slices
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x verify_frida_package_macos.sh
          ./verify_frida_package_macos.sh \
            "${GITHUB_WORKSPACE}/release-frida-17.5.0/frida_17.5.0_iphoneos-arm64_universal.deb"
          cat "${GITHUB_WORKSPACE}/release-frida-17.5.0/BUILD-INFO.txt"
          cat "${GITHUB_WORKSPACE}/release-frida-17.5.0/SHA256SUMS"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-17.5.0-iphone13-ios16.6-universal-debs
          path: release-frida-17.5.0/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${FRIDA_KEYCHAIN_PATH:-}" && -f "$FRIDA_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$FRIDA_KEYCHAIN_PATH" || true
          fi
