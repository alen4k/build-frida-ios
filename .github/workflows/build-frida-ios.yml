name: Build Frida 17.16.4 Universal iOS DEB v6

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: Frida tag/version to build
        required: true
        default: '17.16.4'

permissions:
  contents: read

concurrency:
  group: frida-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  FRIDA_VERSION: ${{ inputs.frida_version || '17.16.4' }}
  # Jailbroken iOS package: use ad-hoc signing. Frida's post-process.py will
  # invoke codesign with "-s -" while preserving the required entitlements.
  IOS_CERTID: '-'

jobs:
  build:
    name: iPhone 13 / iOS 16.6 universal Frida
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Select stable Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show macOS and Xcode environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          node --version
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make dpkg
          gmake --version
          dpkg-deb --version

      - name: Verify ad-hoc signing mode
        shell: bash
        run: |
          set -euxo pipefail
          test "${IOS_CERTID}" = "-"
          cat > "${RUNNER_TEMP}/codesign-probe.c" <<'C'
          int main(void) { return 0; }
          C
          xcrun clang "${RUNNER_TEMP}/codesign-probe.c" -o "${RUNNER_TEMP}/codesign-probe"
          codesign --force --sign - --timestamp=none "${RUNNER_TEMP}/codesign-probe"
          codesign --verify --strict "${RUNNER_TEMP}/codesign-probe"
          echo "Ad-hoc codesign is available."

      - name: Build universal iOS packages
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_frida_universal_ios.sh
          FRIDA_TAG="${FRIDA_VERSION}" IOS_CERTID="-"             ./build_frida_universal_ios.sh             --output "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}"

      - name: Verify rootless package and Mach-O slices
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x verify_frida_package_macos.sh
          ./verify_frida_package_macos.sh             "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/frida_${FRIDA_VERSION}_iphoneos-arm64_universal.deb"
          cat "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/BUILD-INFO.txt"
          cat "${GITHUB_WORKSPACE}/release-frida-${FRIDA_VERSION}/SHA256SUMS"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-${{ env.FRIDA_VERSION }}-iphone13-ios16.6-universal-debs
          path: release-frida-${{ env.FRIDA_VERSION }}/
          if-no-files-found: error
          retention-days: 7
