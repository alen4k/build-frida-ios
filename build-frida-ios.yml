name: Build Frida 17.5.0 Universal iOS DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iPhone 13 / iOS 16.6 universal Frida
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Show macOS and Xcode environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          node --version
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install make dpkg
          gmake --version
          dpkg-deb --version

      - name: Build Frida 17.5.0 universal iOS packages
        shell: bash
        env:
          IOS_CERTID: frida-cert
        run: |
          set -euxo pipefail
          chmod +x build_frida_17.5.0_universal_ios.sh
          ./build_frida_17.5.0_universal_ios.sh \
            --output "${GITHUB_WORKSPACE}/release-frida-17.5.0"

      - name: Verify rootless package and Mach-O slices
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x verify_frida_package_macos.sh
          ./verify_frida_package_macos.sh \
            "${GITHUB_WORKSPACE}/release-frida-17.5.0/frida_17.5.0_iphoneos-arm64_universal.deb"
          cat "${GITHUB_WORKSPACE}/release-frida-17.5.0/BUILD-INFO.txt"
          cat "${GITHUB_WORKSPACE}/release-frida-17.5.0/SHA256SUMS"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-17.5.0-iphone13-ios16.6-universal-debs
          path: release-frida-17.5.0/
          if-no-files-found: error
          retention-days: 7
